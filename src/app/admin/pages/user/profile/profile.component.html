<div class="w-full bg-gray-50 min-h-screen">
  <!-- Top Navigation Bar -->
  <div class="w-full bg-white border-b border-gray-200 shadow-sm sticky top-0 z-10">
    <div class="container mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-4">
        <button 
          pButton 
          type="button" 
          icon="pi pi-arrow-left" 
          class="p-button-text p-button-rounded"
          (click)="goBack()"
        ></button>
        <i class="pi pi-user-edit text-blue-600 text-xl"></i>
        <h2 class="text-lg font-semibold text-gray-800">Update User Profile</h2>
      </div>
    </div>
  </div>
  
  <!-- Main Container -->
  <div class="container mx-auto p-4 max-w-4xl">
    <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
      
      <!-- Form Header -->
      <div class="bg-gradient-to-r from-blue-500 to-blue-600 px-6 py-4">
        <h3 class="text-white text-xl font-semibold">User Information</h3>
        <p class="text-blue-100 text-sm mt-1">Update user details and save changes</p>
      </div>
      
      <!-- Form Content -->
      <form (ngSubmit)="updateUser()" #userForm="ngForm" class="p-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          
          <!-- User ID (Read-only) -->
          <div class="col-span-1 md:col-span-2">
            <label class="block text-sm font-medium text-gray-700 mb-2">
              <i class="pi pi-id-card mr-2 text-blue-500"></i>
              User ID
            </label>
            <input 
              type="text" 
              pInputText 
              [value]="selectedTeam?.id || ''"
              readonly
              class="w-full opacity-60 cursor-not-allowed"
              placeholder="User ID will be generated automatically"
            />
          </div>
          
          <!-- Username -->
          <div class="col-span-1">
            <label class="block text-sm font-medium text-gray-700 mb-2">
              <i class="pi pi-user mr-2 text-blue-500"></i>
              Username *
            </label>
            <input 
              type="text" 
              pInputText 
              [(ngModel)]="selectedTeam.userName"
              name="userName"
              required
              class="w-full"
              placeholder="Enter username"
            />
          </div>
          
          <!-- Email -->
          <div class="col-span-1">
            <label class="block text-sm font-medium text-gray-700 mb-2">
              <i class="pi pi-envelope mr-2 text-blue-500"></i>
              Email Address *
            </label>
            <input 
              type="email" 
              pInputText 
              [(ngModel)]="selectedTeam.email"
              name="email"
              required
              class="w-full"
              placeholder="Enter email address"
            />
          </div>
          
          <!-- Phone Number -->
          <div class="col-span-1">
            <label class="block text-sm font-medium text-gray-700 mb-2">
              <i class="pi pi-phone mr-2 text-blue-500"></i>
              Phone Number
            </label>
            <input 
              type="tel" 
              pInputText 
              [(ngModel)]="selectedTeam.tel"
              name="tel"
              class="w-full"
              placeholder="Enter phone number"
            />
          </div>
          
          <!-- Address -->
          <div class="col-span-1 md:col-span-2">
            <label class="block text-sm font-medium text-gray-700 mb-2">
              <i class="pi pi-map-marker mr-2 text-blue-500"></i>
              Address
            </label>
            <textarea 
              pInputTextarea 
              [(ngModel)]="selectedTeam.address"
              name="address"
              rows="3"
              class="w-full"
              placeholder="Enter full address"
            ></textarea>
          </div>
          
          <!-- Profile Image URL -->
          <div class="col-span-1 md:col-span-2">
            <label class="block text-sm font-medium text-gray-700 mb-2">
              <i class="pi pi-image mr-2 text-blue-500"></i>
              Profile Image URL
            </label>
            <div class="flex gap-3">
              <input 
                type="url" 
                pInputText 
                [(ngModel)]="selectedTeam.image"
                name="image"
                class="flex-1"
                placeholder="Enter image URL"
              />
              <button 
                pButton 
                type="button" 
                icon="pi pi-eye" 
                class="p-button-outlined"
                (click)="previewImage()"
                [disabled]="!selectedTeam?.image"
                pTooltip="Preview Image"
              ></button>
            </div>
            
            <!-- Image Preview -->
            <div *ngIf="selectedTeam?.image && showImagePreview" class="mt-3">
              <img 
                [src]="selectedTeam.image" 
                alt="Profile Preview"
                class="w-20 h-20 rounded-full object-cover border-2 border-gray-200"
                (error)="onImageError()"
              />
            </div>
          </div>
          
        </div>
        
        <!-- Form Actions -->
        <div class="flex justify-between items-center mt-8 pt-6 border-t border-gray-200">
          <div class="flex items-center text-sm text-gray-500">
            <i class="pi pi-info-circle mr-2"></i>
            <span>Fields marked with * are required</span>
          </div>
          
          <div class="flex space-x-3">
            <button 
              pButton 
              type="button" 
              label="Cancel" 
              icon="pi pi-times"
              class="p-button-outlined p-button-secondary"
              (click)="cancelUpdate()"
            ></button>
            
            <button 
              pButton 
              type="submit" 
              label="Update User" 
              icon="pi pi-check"
              class="p-button-primary"
              [disabled]="!userForm.form.valid || isUpdating"
              [loading]="isUpdating"
            ></button>
          </div>
        </div>
        
      </form>
      
    </div>
    
    <!-- Success/Error Messages -->
    <p-messages></p-messages>
    
  </div>
</div>
